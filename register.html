<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinguaHub | Đăng ký</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/register.css" />
  </head>
  <body>
    <div class="page">
      <div class="panel">
        <div class="panel-head">
          <img src="assets/logo.png" alt="LinguaHub Logo" class="logo" />
          <h1>Đăng ký tài khoản</h1>
          <p>Tạo tài khoản học viên để bắt đầu</p>
        </div>

        <form class="auth-form" id="register-form">
          <label>
            Họ tên
            <input name="name" type="text" placeholder="Nhập họ tên" required />
          </label>
          <label>
            Email
            <input name="email" type="email" placeholder="Nhập email" required />
          </label>
          <label>
            Số điện thoại
            <input name="phone" type="tel" placeholder="Nhập số điện thoại" required />
          </label>
          <label>
            Vai trò
            <select name="role">
              <option value="student">Học viên</option>
              <option value="teacher">Giảng viên</option>
            </select>
          </label>
          <label>
            Tên đăng nhập
            <input name="username" type="text" placeholder="Nhập tên đăng nhập" required />
          </label>
          <label>
            Mật khẩu
            <input name="password" type="password" placeholder="Nhập mật khẩu" required />
          </label>
          <label>
            Xác nhận mật khẩu
            <input name="confirmPassword" type="password" placeholder="Nhập lại mật khẩu" required />
          </label>
          <button class="btn btn-primary" type="submit">Đăng ký</button>
        </form>

        <p class="footer-link">
          Đã có tài khoản?
          <a href="login.html">Đăng nhập</a>
        </p>
      </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
